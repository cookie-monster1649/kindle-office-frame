# Frame autostart. Installed at /etc/upstart/frame.conf on the root partition.
#
# Deliberately does almost nothing: hands off to boot.sh on the userstore and
# returns at once. Everything that might need changing lives in boot.sh, which
# can be edited, or deleted, without touching the read-only root again. If
# boot.sh is missing this is a no-op.
#
# framework_ready is emitted with `initctl emit --no-wait` once the Kindle UI
# is up, so nothing here can hold up boot. It is emitted again if the UI
# restarts without a reboot; boot.sh refuses to start a second copy.
#
# Shaped like usbnet.conf on the same device: pre-start only, always returns 0.

start on framework_ready

pre-start script
	BOOT=/mnt/us/dashboard/boot.sh
	[ -f "$BOOT" ] && /usr/bin/setsid /bin/sh "$BOOT" >/dev/null 2>&1 </dev/null &
	return 0
end script
